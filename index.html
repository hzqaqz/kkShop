<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#334c51" />
    <!-- Square badge icons. Never point rel="icon" at the wide wordmark: a tab
         icon is forced into a square, which stretches a 3.3:1 logo.

         The PNG set below is not decoration: browsers key favicons by URL and
         keep a cached "no icon" entry for months, so a working /favicon.ico can
         still leave an empty tab. These URLs were added later, which forces a
         fresh fetch. 96px is also the multiple-of-48 size Google wants for the
         icon it shows next to search results. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Meower | Pet Supplies &amp; Pet-Friendly Air Purifiers</title>
    <meta
      name="description"
      content="Meower pet supplies — strollers, carriers, beds, scratching posts and toys — plus pet-friendly HEPA H13 air purifiers and dehumidifiers for homes and businesses."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://meowerair.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meower" />
    <meta property="og:title" content="Meower | Pet Supplies &amp; Pet-Friendly Air Purifiers" />
    <meta
      property="og:description"
      content="Pet supplies and pet-friendly HEPA H13 air purifiers for cleaner, happier pet homes — plus humidity control for homes and businesses."
    />
    <meta property="og:url" content="https://meowerair.com/" />
    <meta property="og:image" content="https://meowerair.com/images/og-image.jpg" />
    <!-- og:image:width / og:image:height / og:image:alt are emitted per page by
         useSeo(). Do not hardcode them here: this file is the vite-ssg template,
         so anything static leaks into all 21 pages, and the values only hold for
         pages that use the branded card. -->
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meower | Pet Supplies &amp; Pet-Friendly Air Purifiers" />
    <meta
      name="twitter:description"
      content="Pet supplies and pet-friendly HEPA H13 air purifiers for cleaner, happier pet homes — plus humidity control for homes and businesses."
    />
    <meta name="twitter:image" content="https://meowerair.com/images/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Meower pet supplies and pet-friendly air purifiers"
    />

    <!--
      Organization structured data. These values are the machine-readable copy of
      `src/data/siteInfo.js` — the legal entity, the unified social credit code
      (`taxID`), the full Beijing registered address, the contact point and the
      official profiles. Google matches the site against the business it verified
      in Merchant Center, so if an address or phone number changes in siteInfo.js,
      change it here too. A mismatch reads as "the business on the site is not
      the business in the account".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://meowerair.com/#organization",
            "name": "Meower",
            "legalName": "Beijing Zhuoyue Youshi Technology Co., Ltd.",
            "taxID": "91110119MAKB3X4U0M",
            "url": "https://meowerair.com/",
            "logo": "https://meowerair.com/images/logo-meower.webp",
            "description": "Pet supplies and pet-friendly HEPA H13 air purifiers and dehumidifiers, dispatched from the company's own warehouse in Beijing, China.",
            "email": "info@meowerair.com",
            "telephone": "+86 1337 049 7731",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Room 1369, Block D, Building 3, Yard 8, Fenggu 4th Road, Zhongguancun Yanqing Park",
              "addressLocality": "Beijing",
              "addressRegion": "Yanqing District",
              "addressCountry": "CN"
            },
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "info@meowerair.com",
                "telephone": "+86 1337 049 7731",
                "availableLanguage": ["en", "zh"]
              }
            ],
            "sameAs": [
              "https://www.instagram.com/meowerpet/",
              "https://www.linkedin.com/company/meower-air",
              "https://www.tiktok.com/@meowerair"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://meowerair.com/#website",
            "url": "https://meowerair.com/",
            "name": "Meower",
            "publisher": { "@id": "https://meowerair.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Plausible 统计：这是站点专属脚本（pa-...），域名已写在脚本里，
         所以不需要 data-domain。放这里而不是运行时注入，是因为 Plausible
         的安装校验是抓页面源码找 plausible.init，动态注入的它看不见。

         ⚠️ 若之后在 Cloudflare Pages 里设了 VITE_ANALYTICS_PROVIDER=plausible，
         useAnalytics.js 会再注入一份同样的脚本 —— 那样每次访问会被算两次。
         两者只能留一个。

         脚本在 localhost 上会自动禁用，本地开发不会污染数据。 -->
    <script async src="https://plausible.io/js/pa-ryBky5b6BdMRm5yxJj_lA.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (plausible.q = plausible.q || []).push(arguments);
        };
      plausible.init = plausible.init || function (i) {
        plausible.o = i || {};
      };
      plausible.init();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
